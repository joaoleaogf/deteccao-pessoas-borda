# Parâmetros do baseline de nuvem (E5), decisão D5 adotada em 16/11/2026 (a equipe pode rever).
# ATENÇÃO: rtt_ms e banda_subida_kbps são VALORES ASSUMIDOS. A equipe precisa justificá-los com
# uma fonte (relatório de banda larga residencial, por exemplo) antes de usar no artigo.
protocolo: http-jpeg   # quadro a quadro, JPEG sobre TCP/HTTP (simplificação de RTSP/WebRTC: mantém o pareamento por quadro)
codec: jpeg
qualidade_jpeg: 80
rtt_ms: 40             # assumido; aplicado com tc netem, metade em cada sentido
banda_subida_kbps: 10000   # assumido; limite só no sentido cliente -> servidor
servidor: contêiner linux/amd64 nativo no mesmo host (modelos FP32, 4 threads)
